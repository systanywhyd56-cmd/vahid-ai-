<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Vahid AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080808;
color:white;
font-family:Tahoma,Arial;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
}

header{
padding:18px;
text-align:center;
background:#151515;
border-bottom:1px solid #292929;
}

header h2{
margin:0 0 7px;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
padding:12px 14px;
margin:9px 0;
border-radius:14px;
line-height:1.9;
white-space:pre-wrap;
word-break:break-word;
}

.user{
background:#263a63;
margin-right:30px;
}

.ai{
background:#202020;
margin-left:30px;
}

.bottom{
display:flex;
gap:8px;
padding:12px;
background:#151515;
}

input{
flex:1;
padding:14px;
border:0;
outline:none;
border-radius:10px;
font-size:16px;
background:white;
color:black;
}

.send{
background:#fff;
color:#000;
}

button{
border:0;
border-radius:10px;
padding:0 18px;
font-size:18px;
cursor:pointer;
}

.clear{
margin:0 12px 10px;
padding:10px;
background:#252525;
color:white;
}

button:disabled{
opacity:.5;
}

</style>
</head>

<body>

<div class="app">

<header>

<h2>🤖 Vahid AI</h2>

<div>
دستیار هوش مصنوعی وحید
</div>

</header>

<div id="chat"></div>

<button class="clear" onclick="clearChat()">
🗑️ پاک کردن گفتگو
</button>

<div class="bottom">

<input
id="msg"
type="text"
placeholder="پیامت رو بنویس..."
autocomplete="off">

<button
class="send"
id="sendBtn"
onclick="sendMessage()">
➤
</button>

</div>

</div>

<script>

  https:const API =
"https://script.google.com/macros/s/AKfycbx3iXj2yaogGSgFyt1HlPnxLrK7TjjLSigrr6j1nFmusdPY7DXHCntRksdbXcK_c0zG/exec";

const STORAGE =
"vahid_ai_history";

const input =
document.getElementById("msg");

const chat =
document.getElementById("chat");

const sendBtn =
document.getElementById("sendBtn");


function saveLocal(){

localStorage.setItem(
STORAGE,
chat.innerHTML
);

}


function loadLocal(){

const saved =
localStorage.getItem(STORAGE);

if(saved){

chat.innerHTML = saved;

}else{

chat.innerHTML = `
<div class="msg ai">
سلام وحید 👋
<br>
من Vahid AI هستم.
<br>
هر چیزی خواستی بپرس.
</div>
`;

}

chat.scrollTop =
chat.scrollHeight;

}


function addMessage(type,text){

const div =
document.createElement("div");

div.className =
"msg " + type;

div.textContent =
(type === "user" ? "👤 " : "🤖 ")
+ text;

chat.appendChild(div);

saveLocal();

chat.scrollTop =
chat.scrollHeight;

}


async function sendMessage(){

const message =
input.value.trim();

if(!message){
return;
}

addMessage(
"user",
message
);

input.value = "";

sendBtn.disabled = true;


const loading =
document.createElement("div");

loading.className =
"msg ai";

loading.textContent =
"🤖 در حال فکر کردن...";

chat.appendChild(loading);

chat.scrollTop =
chat.scrollHeight;


try{

const url =
API +
"?message=" +
encodeURIComponent(message);


const response =
await fetch(url);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


loading.remove();


if(data.ok){

addMessage(
"ai",
data.reply
);

}else{

addMessage(
"ai",
data.reply ||
"خطایی رخ داد."
);

}


}catch(error){

loading.textContent =
"❌ ارتباط با سرور برقرار نشد.";

saveLocal();

console.error(error);

}


sendBtn.disabled = false;

input.focus();

}


function clearChat(){

localStorage.removeItem(STORAGE);

chat.innerHTML = `
<div class="msg ai">
سلام وحید 👋
<br>
گفتگوی جدید شروع شد.
</div>
`;

saveLocal();

}


input.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

});


loadLocal();

input.focus();

</script>

</body>
  </html>
