function saveLocal(){

}


/* =========================
   بارگذاری گفتگو
========================= */

function loadLocal(){

const saved = localStorage.getItem(STORAGE);

if(saved){

chat.innerHTML = saved;

chat.scrollTop = chat.scrollHeight;

/* =========================
   تبدیل Markdown عکس به عکس واقعی
========================= */

function renderAIText(text){

const container = document.createElement("div");

container.className = "ai-text";


/*
فرمت:
![توضیح](URL)
*/

const imageRegex =
/!([^]*)\](https?:\/\/[^)\s]+)/g;


let lastIndex = 0;
let match;


while((match = imageRegex.exec(text)) !== null){

/*
متن قبل از عکس
*/

const before =
text.substring(
lastIndex,
match.index
);

if(before){

const textNode =
document.createElement("span");

textNode.textContent =
before;

container.appendChild(
textNode
);

}


/*
ساخت تصویر
*/

const img =
document.createElement("img");

img.className =
"chat-image";

img.src =
match[2];

img.alt =
match[1] || "Vahid AI image";

img.loading =
"lazy";


container.appendChild(
img
);


/*
دکمه باز کردن تصویر
*/

const buttons =
document.createElement("div");

buttons.className =
"image-buttons";


const link =
document.createElement("a");

link.href =
match[2];

link.target =
"_blank";

link.textContent =
"🔗 باز کردن تصویر";


buttons.appendChild(
link
);

container.appendChild(
buttons
);


lastIndex =
imageRegex.lastIndex;

}


/*
متن باقی‌مانده
*/

const after =
text.substring(lastIndex);

if(after){

const textNode =
document.createElement("span");

textNode.textContent =
after;

container.appendChild(
textNode
);

}


return container;

}


/* =========================
   اضافه کردن پیام
========================= */

function addMessage(type,text){

const div =
document.createElement("div");

div.className =
"msg " + type;


if(type === "ai"){

const content =
renderAIText(text);

div.appendChild(content);


/*
دکمه خواندن
*/

const speak =
document.createElement("button");

speak.className =
"speak";

speak.textContent =
"🔊 خواندن پاسخ";

speak.onclick =
function(){
speakText(text);
};

div.appendChild(speak);

}else{

const content =
document.createElement("div");

content.className =
"ai-text";

content.textContent =
"👤 " + text;

div.appendChild(content);

}


chat.appendChild(div);

saveLocal();

chat.scrollTop =
chat.scrollHeight;

}
