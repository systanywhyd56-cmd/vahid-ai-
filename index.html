<script>
const API="https://script.google.com/macros/s/AKfycbzm4_7oNgxKWkWrf5yp2G7lhrWJNx5-80BONFJAbAc0FxsN26Mr6zu-_ZWek5a3uUQl/exec";

async function send(){
 const input=document.getElementById("msg");
 const chat=document.getElementById("chat");
 const message=input.value.trim();
 if(!message)return;

 chat.innerHTML+=`<div class="msg">👤 ${message}</div>`;
 input.value="";
 chat.innerHTML+=`<div id="loading" class="msg">🤖 در حال فکر کردن...</div>`;

 try{
  const r=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({message:message})
  });

  const text=await r.text();
  document.getElementById("loading").remove();

  let data;
  try{
   data=JSON.parse(text);
  }catch{
   throw new Error("پاسخ نامعتبر از سرور");
  }

  chat.innerHTML+=`<div class="msg">🤖 ${data.reply || data.message || "پاسخی دریافت نشد."}</div>`;

 }catch(e){
  document.getElementById("loading").innerText="❌ ارتباط با سرور برقرار نشد.";
  console.log(e);
 }
}
</script>
