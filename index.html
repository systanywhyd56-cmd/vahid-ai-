<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vahid AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#080808;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  max-width:650px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

header{
  padding:18px;
  text-align:center;
  background:#151515;
  border-bottom:1px solid #292929;
}

header h2{
  margin:0 0 6px;
}

header p{
  margin:0;
  color:#999;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg{
  padding:12px 15px;
  margin:10px 0;
  border-radius:14px;
  line-height:1.9;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{
  background:#263a63;
  margin-right:30px;
}

.ai{
  background:#202020;
  margin-left:30px;
}

.imageBox{
  background:#151515;
  border-radius:15px;
  padding:8px;
  margin:10px 0;
}

.imageBox img{
  display:block;
  width:100%;
  border-radius:12px;
}

.imageTitle{
  color:#aaa;
  font-size:13px;
  padding:7px 3px;
}

.bottom{
  display:flex;
  gap:8px;
  padding:12px;
  background:#151515;
}

input{
  flex:1;
  min-width:0;
  padding:14px;
  border:0;
  outline:none;
  border-radius:10px;
  font-size:16px;
  background:#fff;
  color:#000;
}

button{
  border:0;
  border-radius:10px;
  cursor:pointer;
}

#send{
  width:55px;
  background:#fff;
  color:#000;
  font-size:22px;
}

#clear{
  margin:0 12px 10px;
  padding:11px;
  background:#252525;
  color:#fff;
  font-size:14px;
}

button:disabled{
  opacity:.5;
}
</style>

</head>

<body>

<div class="app">

<header>
  <h2>🤖 Vahid AI</h2>
  <p>دستیار هوش مصنوعی وحید</p>
</header>

<div id="chat"></div>

<button id="clear">
🗑️ پاک کردن گفتگو
</button>

<div class="bottom">

<input
  id="input"
  type="text"
  placeholder="پیامت رو بنویس..."
  autocomplete="off">

<button id="send">
➤
</button>

</div>

</div>

<script>

/* =========================
   سرور سالم Vahid AI
========================= */

const API =
"https://script.google.com/macros/s/AKfycbx3iXj2yaogGSgFyt1HlPnxLrK7TjjLSigrr6j1nFmusdPY7DXHCntRksdbXcK_c0zG/exec";


/* =========================
   عناصر صفحه
========================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const clear =
document.getElementById("clear");


/* =========================
   پیام
========================= */

function addMessage(type,text){

  const div =
  document.createElement("div");

  div.className =
  "msg " + type;

  div.textContent =
  type === "user"
  ? "👤 " + text
  : "🤖 " + text;

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;

  return div;
}


/* =========================
   تشخیص عکس
========================= */

function isImageRequest(text){

  const t =
  text.toLowerCase();

  return (
    t.includes("عکس بساز") ||
    t.includes("تصویر بساز") ||
    t.includes("عکس درست کن") ||
    t.includes("تصویر درست کن") ||
    t.includes("عکس تولید کن") ||
    t.includes("تصویر تولید کن") ||
    t.includes("عکس ایجاد کن") ||
    t.includes("تصویر ایجاد کن") ||
    t.includes("عکس بکش") ||
    t.includes("تصویر بکش")
  );
}


/* =========================
   ساخت عکس
========================= */

function createImage(prompt){

  const box =
  document.createElement("div");

  box.className =
  "imageBox";


  const title =
  document.createElement("div");

  title.className =
  "imageTitle";

  title.textContent =
  "🎨 در حال ساخت تصویر...";


  const img =
  document.createElement("img");


  const url =
  "https://image.pollinations.ai/prompt/"
  + encodeURIComponent(prompt)
  + "?width=1024&height=1024&nologo=true";


  img.src =
  url;

  img.alt =
  prompt;


  img.onload =
  function(){

    title.textContent =
    "🎨 تصویر ساخته‌شده توسط Vahid AI";

  };


  img.onerror =
  function(){

    title.textContent =
    "❌ ساخت تصویر انجام نشد.";

  };


  box.appendChild(title);

  box.appendChild(img);

  chat.appendChild(box);

  chat.scrollTop =
  chat.scrollHeight;
}


/* =========================
   ارسال پیام به سرور
========================= */

async function askServer(message){

  const url =
  API +
  "?message=" +
  encodeURIComponent(message);


  /*
     جلوگیری از گیر کردن دائمی
  */

  const controller =
  new AbortController();


  const timeout =
  setTimeout(function(){

    controller.abort();

  },30000);


  try{

    const response =
    await fetch(
      url,
      {
        method:"GET",
        mode:"cors",
        cache:"no-store",
        signal:controller.signal
      }
    );


    clearTimeout(timeout);


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const text =
    await response.text();


    if(!text){

      throw new Error(
        "پاسخ خالی است"
      );

    }


    return JSON.parse(text);


  }catch(error){

    clearTimeout(timeout);

    throw error;

  }

}


/* =========================
   ارسال
========================= */

async function sendMessage(){

  const message =
  input.value.trim();


  if(!message){

    return;

  }


  addMessage(
    "user",
    message
  );


  input.value = "";

  send.disabled = true;


  /* =====================
     درخواست عکس
  ===================== */

  if(isImageRequest(message)){

    const loading =
    addMessage(
      "ai",
      "🎨 در حال ساخت تصویر..."
    );


    createImage(message);

    loading.remove();

    send.disabled = false;

    input.focus();

    return;
  }


  /* =====================
     درخواست متن
  ===================== */

  const loading =
  addMessage(
    "ai",
    "در حال فکر کردن..."
  );


  try{

    const data =
    await askServer(message);


    loading.remove();


    if(data.ok){

      addMessage(
        "ai",
        data.reply ||
        "پاسخی دریافت نشد."
      );

    }else{

      addMessage(
        "ai",
        data.reply ||
        "سرور خطا برگرداند."
      );

    }


  }catch(error){

    loading.remove();


    addMessage(
      "ai",
      "❌ اتصال صفحه به سرور برقرار نشد.\n\nاگر سرور را مستقیم باز می‌کنی و جواب می‌دهد، مشکل از محدودیت CORS مرورگر است."
    );


    console.error(error);

  }


  send.disabled = false;

  input.focus();
}


/* =========================
   پاک کردن
========================= */

clear.onclick =
function(){

  chat.innerHTML = "";

  addMessage(
    "ai",
    "سلام وحید 👋\nگفتگوی جدید شروع شد."
  );

};


/* =========================
   دکمه ارسال
========================= */

send.onclick =
sendMessage;


/* =========================
   Enter
========================= */

input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   شروع
========================= */

addMessage(
  "ai",
  "سلام وحید 👋\nمن Vahid AI هستم.\nهر چیزی خواستی بپرس."
);

input.focus();

</script>

</body>
</html>
