<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vahid AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Tahoma,Arial;
}

.app{
  max-width:650px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

header{
  padding:18px;
  text-align:center;
  background:#151515;
  border-bottom:1px solid #292929;
}

header h2{margin:0 0 6px}

#chat{
  flex:1;
  overflow:auto;
  padding:15px;
}

.msg{
  padding:12px 14px;
  margin:9px 0;
  border-radius:14px;
  line-height:1.9;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user{
  background:#263a63;
  margin-right:30px;
}

.ai{
  background:#202020;
  margin-left:30px;
}

.bottom{
  display:flex;
  gap:8px;
  padding:12px;
  background:#151515;
}

input{
  flex:1;
  padding:14px;
  border:0;
  outline:none;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:0 17px;
  font-size:18px;
  cursor:pointer;
}

.clear{
  margin:0 12px 10px;
  padding:10px;
  background:#252525;
  color:white;
}

button:disabled{opacity:.5}
</style>
</head>

<body>

<div class="app">

<header>
<h2>🤖 Vahid AI</h2>
<div>دستیار هوش مصنوعی وحید</div>
</header>

<div id="chat">

<div class="msg ai">
سلام وحید 👋
<br>
من Vahid AI هستم.
<br>
هر چیزی خواستی بپرس.
</div>

</div>

<button class="clear" onclick="clearChat()">
🗑️ پاک کردن گفتگو
</button>

<div class="bottom">

<input
id="msg"
placeholder="پیامت رو بنویس..."
autocomplete="off">

<button id="sendBtn" onclick="send()">
➤
</button>

</div>

</div>

<script>

/* آدرس فعال Vahid AI */
const API =
"https://script.google.com/macros/s/AKfycbx3iXj2yaogGSgFyt1HlPnxLrK7TjjLSigrr6j1nFmusdPY7DXHCntRksdbXcK_c0zG/exec";

const input =
document.getElementById("msg");

const chat =
document.getElementById("chat");

const sendBtn =
document.getElementById("sendBtn");


/* اضافه کردن پیام */
function addMessage(type,text){

  const div =
  document.createElement("div");

  div.className =
  "msg " + type;

  div.textContent =
  (type === "user" ? "👤 " : "🤖 ")
  + text;

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;
}


/* ارسال پیام */
async function send(){

  const message =
  input.value.trim();

  if(!message) return;

  addMessage(
    "user",
    message
  );

  input.value = "";

  sendBtn.disabled = true;

  const loading =
  document.createElement("div");

  loading.className =
  "msg ai";

  loading.textContent =
  "🤖 در حال فکر کردن...";

  chat.appendChild(loading);

  chat.scrollTop =
  chat.scrollHeight;


  try{

    /*
      استفاده از GET
      چون Web App فعلی
      با message کار می‌کند
    */

    const url =
      API +
      "?message=" +
      encodeURIComponent(message);


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "خطای اتصال: " +
        response.status
      );

    }


    const data =
      await response.json();


    loading.remove();


    if(
      data &&
      data.ok === true &&
      data.reply
    ){

      addMessage(
        "ai",
        data.reply
      );

    }else{

      addMessage(
        "ai",
        data.reply ||
        "پاسخی از سرور دریافت نشد."
      );

    }


  }catch(error){

    loading.remove();

    addMessage(
      "ai",
      "❌ ارتباط با سرور برقرار نشد.\n" +
      error.message
    );

  }


  sendBtn.disabled =
  false;

  input.focus();
}


/* ارسال با Enter */
input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      send();

    }

  }
);


/* پاک کردن گفتگو */
function clearChat(){

  chat.innerHTML = `
    <div class="msg ai">
    سلام وحید 👋
    <br>
    من Vahid AI هستم.
    <br>
    هر چیزی خواستی بپرس.
    </div>
  `;

  input.focus();
}

</script>

</body>
</html>
