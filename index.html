<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vahid AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#070707;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
height:100vh;
}

.app{
max-width:700px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
background:#0b0b0b;
}

header{
padding:15px 18px;
display:flex;
align-items:center;
justify-content:space-between;
background:#111;
border-bottom:1px solid #292929;
}

.logo{
font-size:25px;
display:flex;
align-items:center;
gap:10px;
}

.logo small{
font-size:11px;
color:#777;
display:block;
}

.status{
font-size:11px;
color:#65d681;
}

#chat{
flex:1;
overflow:auto;
padding:18px;
}

.msg{
max-width:88%;
padding:13px 16px;
margin:10px 0;
border-radius:17px;
line-height:1.9;
white-space:pre-wrap;
word-break:break-word;
animation:show .2s ease;
}

.user{
margin-right:auto;
background:#263d69;
border-bottom-left-radius:5px;
}

.ai{
margin-left:auto;
background:#181818;
border:1px solid #292929;
border-bottom-right-radius:5px;
}

@keyframes show{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:translateY(0)}
}

.welcome{
text-align:center;
padding:55px 15px;
color:#888;
}

.welcome b{
display:block;
font-size:26px;
color:white;
margin-bottom:10px;
}

.bottom{
padding:12px;
background:#111;
border-top:1px solid #292929;
display:flex;
gap:8px;
}

input{
flex:1;
min-width:0;
padding:14px;
border:1px solid #333;
border-radius:14px;
background:#191919;
color:white;
outline:none;
font-size:15px;
}

input:focus{
border-color:#555;
}

button{
border:0;
border-radius:13px;
cursor:pointer;
}

#send{
width:50px;
background:#fff;
color:#000;
font-size:20px;
}

#clear{
margin:0 12px 10px;
padding:9px;
background:#181818;
color:#aaa;
border:1px solid #292929;
}

button:disabled{
opacity:.5;
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
🤖
<div>
<b>Vahid AI</b>
<small>دستیار هوش مصنوعی وحید</small>
</div>
</div>

<div class="status">
● آنلاین
</div>

</header>

<div id="chat">

<div class="welcome">
<div style="font-size:50px">🤖</div>
<b>سلام وحید 👋</b>
هر چیزی خواستی از من بپرس.
</div>

</div>

<button id="clear" onclick="clearChat()">
🗑️ پاک کردن گفتگو
</button>

<div class="bottom">

<input
id="msg"
placeholder="پیامت رو بنویس..."
autocomplete="off">

<button id="send" onclick="send()">➤</button>

</div>

</div>

<script>

const API=
"https://script.google.com/macros/s/AKfycbx3iXj2yaogGSgFyt1HlPnxLrK7TjjLSigrr6j1nFmusdPY7DXHCntRksdbXcK_c0zG/exec";

const input=
document.getElementById("msg");

const chat=
document.getElementById("chat");

const sendBtn=
document.getElementById("send");

function addMessage(type,text){

const div=
document.createElement("div");

div.className=
"msg "+type;

div.textContent=
(type==="user"?"👤 ":"🤖 ")+text;

chat.appendChild(div);

chat.scrollTop=
chat.scrollHeight;
}

async function send(){

const text=
input.value.trim();

if(!text)return;

addMessage("user",text);

input.value="";

sendBtn.disabled=true;

const loading=
document.createElement("div");

loading.className="msg ai";

loading.textContent=
"🤖 در حال فکر کردن...";

chat.appendChild(loading);

try{

const response=
await fetch(
API+"?message="+
encodeURIComponent(text)
);

const data=
await response.json();

loading.remove();

addMessage(
"ai",
data.ok?
data.reply:
(data.reply||"خطایی رخ داد.")
);

}catch(e){

loading.remove();

addMessage(
"ai",
"❌ ارتباط با سرور برقرار نشد."
);

}

sendBtn.disabled=false;

input.focus();
}

input.addEventListener(
"keydown",
e=>{
if(e.key==="Enter"){
e.preventDefault();
send();
}
}
);

function clearChat(){

chat.innerHTML=
`
<div class="welcome">
<div style="font-size:50px">🤖</div>
<b>سلام وحید 👋</b>
هر چیزی خواستی از من بپرس.
</div>
`;

}

</script>

</body>
</html>
