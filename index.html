<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vahid AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080a0f;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
}

.app{
  max-width:650px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

header{
  padding:18px;
  text-align:center;
  background:#11151e;
  border-bottom:1px solid #292f3a;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:7px 0 0;
  color:#9aa3b2;
  font-size:13px;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg{
  padding:12px 15px;
  margin:9px 0;
  border-radius:14px;
  line-height:1.9;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{
  background:#29395d;
  margin-right:12%;
}

.ai{
  background:#171c26;
  border:1px solid #293140;
  margin-left:8%;
}

.loading{
  color:#9aa3b2;
}

.bottom{
  display:flex;
  gap:8px;
  padding:10px;
  background:#11151e;
  border-top:1px solid #292f3a;
}

input{
  flex:1;
  min-width:0;
  padding:14px;
  border:0;
  outline:0;
  border-radius:12px;
  background:#222834;
  color:white;
  font-size:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:0 18px;
  background:#536dff;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>🤖 Vahid AI</h1>
<p>دستیار هوش مصنوعی وحید</p>
</header>

<div id="chat">

<div class="msg ai">
سلام وحید 👋
من Vahid AI هستم.
هر چیزی خواستی بپرس.
</div>

</div>

<div class="bottom">

<input
id="input"
type="text"
placeholder="پیامت رو بنویس..."
autocomplete="off"
>

<button onclick="sendMessage()">➤</button>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzm4_7oNgxKWkWrf5yp2G7lhrWJNx5-80BONFJAbAc0FxsN26Mr6zu-_ZWek5a3uUQl/exec";


async function sendMessage(){

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if(!message) return;

  chat.innerHTML +=
    '<div class="msg user">👤 ' +
    escapeHTML(message) +
    '</div>';

  input.value = "";

  const loadingId = "loading-" + Date.now();

  chat.innerHTML +=
    '<div class="msg ai loading" id="' +
    loadingId +
    '">🤖 در حال فکر کردن...</div>';

  chat.scrollTop = chat.scrollHeight;

  try{

    const response = await fetch(
      API_URL +
      "?message=" +
      encodeURIComponent(message)
    );

    const data = await response.json();

    const loading =
      document.getElementById(loadingId);

    if(loading){
      loading.remove();
    }

    chat.innerHTML +=
      '<div class="msg ai">🤖 ' +
      escapeHTML(
        data.reply || "پاسخی دریافت نشد."
      ) +
      '</div>';

  }catch(error){

    const loading =
      document.getElementById(loadingId);

    if(loading){
      loading.innerText =
        "❌ ارتباط با سرور برقرار نشد.";
    }

  }

  chat.scrollTop = chat.scrollHeight;
}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


document
.getElementById("input")
.addEventListener("keydown",function(event){

  if(event.key === "Enter"){
    sendMessage();
  }

});

</script>

</body>
  </html>
