<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vahid AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#080808;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  max-width:650px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

header{
  padding:18px;
  text-align:center;
  background:#151515;
  border-bottom:1px solid #292929;
}

header h2{
  margin:0 0 6px;
}

header p{
  margin:0;
  color:#999;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg{
  padding:12px 15px;
  margin:10px 0;
  border-radius:14px;
  line-height:1.9;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{
  background:#263a63;
  margin-right:30px;
}

.ai{
  background:#202020;
  margin-left:30px;
}

.imageBox{
  background:#151515;
  border-radius:15px;
  padding:8px;
  margin:10px 0;
}

.imageBox img{
  width:100%;
  display:block;
  border-radius:12px;
}

.imageTitle{
  color:#aaa;
  font-size:13px;
  padding:7px 3px;
}

.clear{
  margin:0 12px 10px;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#252525;
  color:#fff;
  font-size:14px;
}

.bottom{
  display:flex;
  gap:8px;
  padding:12px;
  background:#151515;
}

input{
  flex:1;
  min-width:0;
  padding:14px;
  border:0;
  outline:none;
  border-radius:10px;
  font-size:16px;
  background:#fff;
  color:#000;
}

#send{
  width:55px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-size:22px;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h2>🤖 Vahid AI</h2>
  <p>دستیار هوش مصنوعی وحید</p>
</header>

<div id="chat"></div>

<button class="clear" id="clear">
🗑️ پاک کردن گفتگو
</button>

<div class="bottom">

<input
  id="input"
  type="text"
  placeholder="پیامت رو بنویس..."
  autocomplete="off">

<button id="send">➤</button>

</div>

</div>

<script>

/* =========================
   آدرس سرور Vahid AI
========================= */

const API =
"https://script.google.com/macros/s/AKfycbx3iXj2yaogGSgFyt1HlPnxLrK7TjjLSigrr6j1nFmusdPY7DXHCntRksdbXcK_c0zG/exec";


/* =========================
   عناصر صفحه
========================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const clear =
document.getElementById("clear");


/* =========================
   اضافه کردن پیام
========================= */

function addMessage(type,text){

  const div =
  document.createElement("div");

  div.className =
  "msg " + type;

  div.textContent =
  type === "user"
  ? "👤 " + text
  : "🤖 " + text;

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;
}


/* =========================
   تشخیص درخواست عکس
========================= */

function wantsImage(text){

  const t =
  text.toLowerCase();

  return (
    t.includes("عکس بساز") ||
    t.includes("تصویر بساز") ||
    t.includes("عکس درست کن") ||
    t.includes("تصویر درست کن") ||
    t.includes("عکس تولید کن") ||
    t.includes("تصویر تولید کن") ||
    t.includes("عکس ایجاد کن") ||
    t.includes("تصویر ایجاد کن") ||
    t.includes("عکس بکش") ||
    t.includes("تصویر بکش")
  );
}


/* =========================
   ساخت تصویر
========================= */

function showImage(prompt){

  const box =
  document.createElement("div");

  box.className =
  "imageBox";

  const title =
  document.createElement("div");

  title.className =
  "imageTitle";

  title.textContent =
  "🎨 در حال ساخت تصویر...";

  const img =
  document.createElement("img");


  const imageUrl =
  "https://image.pollinations.ai/prompt/"
  + encodeURIComponent(prompt)
  + "?width=1024&height=1024&nologo=true";


  img.src =
  imageUrl;

  img.alt =
  prompt;


  img.onload =
  function(){

    title.textContent =
    "🎨 تصویر ساخته‌شده توسط Vahid AI";

  };


  img.onerror =
  function(){

    title.textContent =
    "❌ تصویر ساخته نشد.";

  };


  box.appendChild(title);

  box.appendChild(img);

  chat.appendChild(box);

  chat.scrollTop =
  chat.scrollHeight;
}


/* =========================
   ارسال پیام
========================= */

async function sendMessage(){

  const text =
  input.value.trim();

  if(!text){
    return;
  }


  addMessage(
    "user",
    text
  );


  input.value = "";

  send.disabled = true;


  /* درخواست تصویر */

  if(wantsImage(text)){

    const loading =
    addMessage(
      "ai",
      "🎨 در حال ساخت تصویر..."
    );


    showImage(text);

    loading.remove();

    send.disabled = false;

    input.focus();

    return;
  }


  /* درخواست معمولی */

  const loading =
  addMessage(
    "ai",
    "در حال فکر کردن..."
  );


  try{

    const url =
    API +
    "?message=" +
    encodeURIComponent(text);


    const response =
    await fetch(url);


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
    await response.json();


    loading.remove();


    if(data.ok){

      addMessage(
        "ai",
        data.reply ||
        "پاسخی دریافت نشد."
      );

    }else{

      addMessage(
        "ai",
        data.reply ||
        "خطایی رخ داد."
      );

    }


  }catch(error){

    loading.remove();

    addMessage(
      "ai",
      "❌ ارتباط با سرور برقرار نشد."
    );

    console.error(error);

  }


  send.disabled = false;

  input.focus();
}


/* =========================
   پاک کردن گفتگو
========================= */

clear.onclick =
function(){

  chat.innerHTML = "";

  addMessage(
    "ai",
    "سلام وحید 👋\nمن Vahid AI هستم."
  );

};


/* =========================
   دکمه ارسال
========================= */

send.onclick =
sendMessage;


/* =========================
   ارسال با Enter
========================= */

input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   پیام شروع
========================= */

addMessage(
  "ai",
  "سلام وحید 👋\nمن Vahid AI هستم.\nبرای ساخت عکس بنویس: «یک گرگ سیاه در برف بساز»"
);

input.focus();

</script>

</body>
</html>
