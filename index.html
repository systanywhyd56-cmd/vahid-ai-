<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Vahid AI</title>


<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#080808;

color:white;

font-family:
Tahoma,
Arial,
sans-serif;

}

.app{

width:100%;

max-width:700px;

height:100vh;

margin:auto;

display:flex;

flex-direction:column;

background:#080808;

}

header{

padding:18px;

text-align:center;

background:#151515;

border-bottom:
1px solid #292929;

}

header h2{

margin:
0 0 7px;

}

.status{

font-size:13px;

color:#aaa;

}


#chat{

flex:1;

overflow-y:auto;

padding:15px;

}


.msg{

padding:
12px 14px;

margin:
9px 0;

border-radius:
14px;

line-height:
1.9;

white-space:
pre-wrap;

word-break:
break-word;

}


.user{

background:#263a63;

margin-right:30px;

}


.ai{

background:#202020;

margin-left:30px;

}


.bottom{

display:flex;

gap:7px;

padding:10px;

background:#151515;

}


input{

flex:1;

padding:14px;

border:0;

outline:none;

border-radius:10px;

font-size:16px;

background:white;

color:black;

}


button{

border:0;

border-radius:10px;

font-size:17px;

cursor:pointer;

}


.send{

background:white;

color:black;

width:55px;

}


.voice{

background:#292929;

color:white;

width:50px;

}


.image{

background:#292929;

color:white;

width:50px;

}


.clear{

margin:
0 10px 10px;

padding:11px;

background:#252525;

color:white;

}


.speak{

margin-top:7px;

padding:6px 10px;

background:#333;

color:white;

font-size:13px;

}


button:disabled{

opacity:.5;

}


#imagePreview{

display:none;

padding:10px;

background:#151515;

}


#imagePreview img{

max-width:150px;

max-height:150px;

border-radius:10px;

}


.removeImage{

margin-top:5px;

padding:5px 9px;

background:#333;

color:white;

font-size:12px;

}


</style>

</head>


<body>


<div class="app">


<header>

<h2>🤖 Vahid AI</h2>

<div>
دستیار هوش مصنوعی وحید
</div>

<div class="status">
🟢 Online
</div>

</header>


<div id="chat"></div>


<div id="imagePreview">

<img id="preview">

<br>

<button
class="removeImage"
onclick="removeImage()"
>
حذف عکس
</button>

</div>


<button
class="clear"
onclick="clearChat()"
>
🗑️ پاک کردن گفتگو
</button>


<div class="bottom">


<button
class="image"
onclick="chooseImage()"
title="Image"
>
🖼️
</button>


<input
id="msg"
type="text"
placeholder="پیامت رو بنویس..."
autocomplete="off"
>


<button
class="voice"
id="voiceBtn"
onclick="startVoice()"
title="Voice"
>
🎤
</button>


<button
class="send"
id="sendBtn"
onclick="sendMessage()"
>
➤
</button>


</div>


<input
id="imageInput"
type="file"
accept="image/*"
style="display:none"
>


</div>


<script>


// ===================================
// API
// ===================================

const API =
"https://script.google.com/macros/s/AKfycbx3iXj2yaogGSgFyt1HlPnxLrK7TjjLSigrr6j1nFmusdPY7DXHCntRksdbXcK_c0zG/exec";


const STORAGE =
"vahid_ai_history";


const input =
document.getElementById("msg");


const chat =
document.getElementById("chat");


const sendBtn =
document.getElementById("sendBtn");


const voiceBtn =
document.getElementById("voiceBtn");


const imageInput =
document.getElementById("imageInput");


const imagePreview =
document.getElementById("imagePreview");


const preview =
document.getElementById("preview");


let selectedImage = null;


// ===================================
// LOCAL HISTORY
// ===================================

function saveLocal(){

localStorage.setItem(

STORAGE,

chat.innerHTML

);

}


function loadLocal(){

const saved =
localStorage.getItem(
STORAGE
);


if(saved){

chat.innerHTML =
saved;

}else{

chat.innerHTML = `

<div class="msg ai">

سلام وحید 👋

<br>

من Vahid AI هستم.

<br>

هر چیزی خواستی بپرس.

</div>

`;

}


chat.scrollTop =
chat.scrollHeight;

}


// ===================================
// ADD MESSAGE
// ===================================

function addMessage(
type,
text
){

const div =
document.createElement(
"div"
);


div.className =
"msg " + type;


const content =
document.createElement(
"div"
);


content.textContent =

(
type === "user"
? "👤 "
: "🤖 "
) + text;


div.appendChild(
content
);


// دکمه خواندن پاسخ AI

if(type === "ai"){

const speak =
document.createElement(
"button"
);


speak.className =
"speak";


speak.textContent =
"🔊 خواندن پاسخ";


speak.onclick =
function(){

speakText(text);

};


div.appendChild(
speak
);

}


chat.appendChild(
div
);


saveLocal();


chat.scrollTop =
chat.scrollHeight;

}


// ===================================
// SEND MESSAGE
// ===================================

async function sendMessage(){

const message =
input.value.trim();


if(!message){
return;
}


addMessage(
"user",
message
);


input.value = "";


sendBtn.disabled =
true;


const loading =
document.createElement(
"div"
);


loading.className =
"msg ai";


loading.textContent =
"🤖 در حال فکر کردن...";


chat.appendChild(
loading
);


chat.scrollTop =
chat.scrollHeight;


try{


const url =

API +
"?message=" +
encodeURIComponent(
message
);


const response =
await fetch(
url
);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


loading.remove();


if(data.ok){

addMessage(
"ai",
data.reply
);

}else{

addMessage(
"ai",
data.reply ||
"خطایی رخ داد."
);

}


}catch(error){


loading.textContent =
"❌ ارتباط با سرور برقرار نشد.";


saveLocal();


console.error(
error
);


}


sendBtn.disabled =
false;


input.focus();

}


// ===================================
// ENTER
// ===================================

input.addEventListener(

"keydown",

function(event){

if(
event.key === "Enter"
){

event.preventDefault();

sendMessage();

}

}

);


// ===================================
// CLEAR CHAT
// ===================================

async function clearChat(){

localStorage.removeItem(
STORAGE
);


chat.innerHTML = `

<div class="msg ai">

سلام وحید 👋

<br>

گفتگوی جدید شروع شد.

</div>

`;


saveLocal();


try{

await fetch(
API +
"?action=clearHistory"
);

}catch(error){

console.log(error);

}

}


// ===================================
// VOICE INPUT
// ===================================

function startVoice(){


const SpeechRecognition =

window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert(
"مرورگر شما از Voice پشتیبانی نمی‌کند."
);

return;

}


const recognition =
new SpeechRecognition();


recognition.lang =
"fa-IR";


recognition.continuous =
false;


recognition.interimResults =
false;


voiceBtn.disabled =
true;


voiceBtn.textContent =
"⏺️";


recognition.start();


recognition.onresult =
function(event){

const text =

event
.results[0][0]
.transcript;


input.value =
text;

};


recognition.onerror =
function(event){

console.log(
event.error
);

alert(
"دریافت صدا انجام نشد."
);

};


recognition.onend =
function(){

voiceBtn.disabled =
false;

voiceBtn.textContent =
"🎤";

};

}


// ===================================
// TEXT TO SPEECH
// ===================================

function speakText(text){

if(!("speechSynthesis" in window)){

alert(
"مرورگر شما از خواندن صدا پشتیبانی نمی‌کند."
);

return;

}


speechSynthesis.cancel();


const speech =
new SpeechSynthesisUtterance(
text
);


speech.lang =
"fa-IR";


speech.rate =
0.95;


speech.pitch =
1;


speech.volume =
1;


speechSynthesis.speak(
speech
);

}


// ===================================
// IMAGE
// ===================================

function chooseImage(){

imageInput.click();

}


imageInput.addEventListener(

"change",

function(){

const file =
imageInput.files[0];


if(!file){
return;
}


selectedImage =
file;


const reader =
new FileReader();


reader.onload =
function(event){

preview.src =
event.target.result;

imagePreview.style.display =
"block";

};


reader.readAsDataURL(
file
);

}

);


// ===================================
// REMOVE IMAGE
// ===================================

function removeImage(){

selectedImage =
null;

imageInput.value =
"";

preview.src =
"";

imagePreview.style.display =
"none";

}


// ===================================
// START
// ===================================

loadLocal();

input.focus();


</script>


</body>

</html>
