<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Vahid AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080808;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
}

header{
padding:18px;
text-align:center;
background:#151515;
border-bottom:1px solid #292929;
}

header h2{
margin:0 0 7px;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
padding:12px 14px;
margin:9px 0;
border-radius:14px;
line-height:1.9;
white-space:pre-wrap;
word-break:break-word;
}

.user{
background:#263a63;
margin-right:30px;
}

.ai{
background:#202020;
margin-left:30px;
}

.image-box{
margin:12px 0;
padding:8px;
background:#151515;
border-radius:16px;
}

.image-box img{
width:100%;
display:block;
border-radius:12px;
}

.image-title{
padding:8px 4px;
color:#aaa;
font-size:13px;
}

.bottom{
display:flex;
gap:8px;
padding:12px;
background:#151515;
}

input{
flex:1;
padding:14px;
border:0;
outline:none;
border-radius:10px;
font-size:16px;
background:#fff;
color:#000;
}

.send{
background:#fff;
color:#000;
}

button{
border:0;
border-radius:10px;
padding:0 18px;
font-size:18px;
cursor:pointer;
}

.clear{
margin:0 12px 10px;
padding:10px;
background:#252525;
color:#fff;
}

button:disabled{
opacity:.5;
}

</style>

</head>

<body>

<div class="app">

<header>

<h2>🤖 Vahid AI</h2>

<div>
دستیار هوش مصنوعی وحید
</div>

</header>


<div id="chat"></div>


<button
class="clear"
onclick="clearChat()">

🗑️ پاک کردن گفتگو

</button>


<div class="bottom">

<input
id="msg"
type="text"
placeholder="پیامت رو بنویس..."
autocomplete="off">

<button
class="send"
id="sendBtn"
onclick="sendMessage()">

➤

</button>

</div>

</div>


<script>

/* =========================
   سرور Vahid AI
========================= */

const API =
"https://script.google.com/macros/s/AKfycbx3iXj2yaogGSgFyt1HlPnxLrK7TjjLSigrr6j1nFmusdPY7DXHCntRksdbXcK_c0zG/exec";


/* =========================
   موتور ساخت تصویر
========================= */

const IMAGE_API =
"https://image.pollinations.ai/prompt/";


/* =========================
   حافظه محلی
========================= */

const STORAGE =
"vahid_ai_history";


const input =
document.getElementById("msg");

const chat =
document.getElementById("chat");

const sendBtn =
document.getElementById("sendBtn");


/* =========================
   ذخیره گفتگو
========================= */

function saveLocal(){

localStorage.setItem(
STORAGE,
chat.innerHTML
);

}


/* =========================
   بارگذاری گفتگو
========================= */

function loadLocal(){

const saved =
localStorage.getItem(STORAGE);

if(saved){

chat.innerHTML =
saved;

}else{

chat.innerHTML = `

<div class="msg ai">

سلام وحید 👋

<br>

من Vahid AI هستم.

<br>

هر چیزی خواستی بپرس.

</div>

`;

}

chat.scrollTop =
chat.scrollHeight;

}


/* =========================
   اضافه کردن پیام
========================= */

function addMessage(type,text){

const div =
document.createElement("div");

div.className =
"msg " + type;

div.textContent =
(type === "user"
? "👤 "
: "🤖 ")
+ text;

chat.appendChild(div);

saveLocal();

chat.scrollTop =
chat.scrollHeight;

}


/* =========================
   تشخیص درخواست عکس
========================= */

function isImageRequest(text){

const t =
text.toLowerCase();

const commands = [

"عکس بساز",
"تصویر بساز",
"عکس درست کن",
"تصویر درست کن",
"عکس تولید کن",
"تصویر تولید کن",
"عکس ایجاد کن",
"تصویر ایجاد کن",
"یه عکس",
"یک عکس",
"عکس از",
"تصویر از",
"تصویر",
"عکس"

];

return commands.some(
x => t.includes(x)
);

}


/* =========================
   ساخت عکس
========================= */

function createImage(prompt){

const box =
document.createElement("div");

box.className =
"image-box";


const img =
document.createElement("img");


const title =
document.createElement("div");

title.className =
"image-title";

title.textContent =
"🎨 تصویر در حال ساخته‌شدن است...";


let cleanPrompt =
prompt;


/* حذف عبارت‌های ابتدایی */

const removeWords = [

"عکس بساز",
"تصویر بساز",
"عکس درست کن",
"تصویر درست کن",
"عکس تولید کن",
"تصویر تولید کن",
"عکس ایجاد کن",
"تصویر ایجاد کن",
"یه عکس",
"یک عکس",
"عکس از",
"تصویر از"

];


removeWords.forEach(
word => {

cleanPrompt =
cleanPrompt.replace(
word,
""
);

}
);


cleanPrompt =
cleanPrompt.trim();


if(!cleanPrompt){

cleanPrompt =
prompt;

}


/* =========================
   آدرس تصویر
========================= */

const imageUrl =
IMAGE_API +
encodeURIComponent(cleanPrompt);


/* تصویر */

img.src =
imageUrl;

img.alt =
cleanPrompt;

img.loading =
"lazy";


/* وقتی عکس آمد */

img.onload =
function(){

title.textContent =
"🎨 تصویر ساخته‌شده توسط Vahid AI";

};


/* اگر خطا شد */

img.onerror =
function(){

title.textContent =
"❌ ساخت تصویر انجام نشد. دوباره امتحان کن.";

};


box.appendChild(img);

box.appendChild(title);

chat.appendChild(box);

saveLocal();

chat.scrollTop =
chat.scrollHeight;

}


/* =========================
   ارسال پیام
========================= */

async function sendMessage(){

const message =
input.value.trim();


if(!message){

return;

}


/* پیام کاربر */

addMessage(
"user",
message
);


input.value = "";

sendBtn.disabled =
true;


/* =========================
   اگر درخواست عکس بود
========================= */

if(isImageRequest(message)){

const loading =
document.createElement("div");

loading.className =
"msg ai";

loading.textContent =
"🤖 در حال ساخت تصویر...";

chat.appendChild(loading);

chat.scrollTop =
chat.scrollHeight;


createImage(message);


loading.remove();

sendBtn.disabled =
false;

input.focus();

return;

}


/* =========================
   درخواست معمولی
========================= */

const loading =
document.createElement("div");

loading.className =
"msg ai";

loading.textContent =
"🤖 در حال فکر کردن...";

chat.appendChild(loading);

chat.scrollTop =
chat.scrollHeight;


try{


const url =
API +
"?message=" +
encodeURIComponent(message);


const response =
await fetch(url);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


loading.remove();


if(data.ok){

addMessage(
"ai",
data.reply
);

}else{

addMessage(
"ai",
data.reply ||
"خطایی رخ داد."
);

}


}catch(error){

loading.textContent =
"❌ ارتباط با سرور برقرار نشد.";

saveLocal();

console.error(error);

}


sendBtn.disabled =
false;

input.focus();

}


/* =========================
   پاک کردن گفتگو
========================= */

function clearChat(){

localStorage.removeItem(
STORAGE
);

chat.innerHTML = `

<div class="msg ai">

سلام وحید 👋

<br>

گفتگوی جدید شروع شد.

</div>

`;

saveLocal();

}


/* =========================
   دکمه Enter
========================= */

input.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

});


/* =========================
   شروع برنامه
========================= */

loadLocal();

input.focus();

</script>

</body>

</html>
